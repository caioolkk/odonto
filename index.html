function finance(){const t=today(),first=S.period==='day'?t:S.period==='month'?t.slice(0,7)+'-01':S.period==='year'?t.slice(0,4)+'-01-01':S.start,last=S.period==='day'?t:S.period==='month'?`${t.slice(0,7)}-${new Date(Number(t.slice(0,4)),Number(t.slice(5,7)),0).getDate()}`:S.period==='year'?t.slice(0,4)+'-12-31':S.end;const lo=first<last?first:last,hi=first>last?first:last;const paid=S.data.payments.filter(p=>{const v=localDateTime(p.paid_at).slice(0,10);return v>=lo&&v<=hi}).sort((a,b)=>b.paid_at.localeCompare(a.paid_at));const receipts=paid.reduce((v,p)=>v+p.amount_cents,0);const contracted=S.data.treatments.filter(t=>{const v=localDateTime(t.treatment_at).slice(0,10);return v>=lo&&v<=hi}).reduce((v,t)=>v+t.price_cents,0);const due=S.data.treatments.filter(t=>!t.ended_on).reduce((n,t)=>n+Math.max(0,t.price_cents-totalPaid(t)),0);const buckets={};paid.forEach(p=>{const v=localDateTime(p.paid_at).slice(0,10),key=S.period==='year'?v.slice(0,7):v;buckets[key]=(buckets[key]||0)+p.amount_cents});const entries=Object.entries(buckets).sort(([a],[b])=>a.localeCompare(b)),big=Math.max(1,...entries.map(x=>x[1]));return `${head('FINANCEIRO','Faturamento','Entradas reais separadas dos valores ainda a receber.',`<button class="button" data-action="export">⇩ Exportar CSV</button>`)}<div class="surface finance-period"><div class="period"><div class="segmented">${[['day','Dia'],['month','Mês'],['year','Ano'],['custom','Período']].map(([k,label])=>`<button data-action="period" data-period="${k}" class="${S.period===k?'active':''}">${label}</button>`).join('')}</div>${S.period==='custom'?`<div class="fields" style="display:flex;align-items:center;flex-wrap:wrap"><label class="field">De<input id="financeStart" type="date" value="${S.start}"></label><label class="field">Até<input id="financeEnd" type="date" value="${S.end}"></label></div>`:''}</div><p>Período: ${dateFmt(lo)} a ${dateFmt(hi)}</p></div><div class="metrics"><div class="metric"><div class="metric-icon">↗</div><p class="la function renderModal(){const m=S.modal;if(!m)return;let html='';if(m.type==='patient'){const p=S.data.patients.find(x=>x.id===m.id);if(!p){S.modal=null;return}const ts=patientTreatments(p);html=modalFrame(E(p.name),'Ficha do paciente · Nome não editável',`<div class="detail-grid"><div class="detail"><small>Nome completo</small><strong>${E(p.name)}</strong></div><div class="detail"><small>Telefone</small><strong>${E(fmtPhone(p.phone))}</strong></div><div class="detail"><small>Data de nascimento</small><strong>${dateFmt(p.birth_date)}</strong></div><div class="detail"><small>Total em tratamentos</small><strong>${money(ts.reduce((n,t)=>n+t.price_cents,0))}</strong></div></div><button class="button light tiny" data-action="editPatient" data-id="${E(p.id)}">✎ Editar telefone / nascimento</button><hr class="form-divider"><h3>Histórico de tratamentos (${ts.length})</h3><div style="height:10px"></div>${ts.length?ts.map(t=>`<div class="treatment-item"><div class="treatment-top"><strong>${E(t.treatment_name)}</strong>${tagStatus(t)}</div><div class="rows"><div>Indicação: ${E(t.referral)} · Início: ${dateFmt(t.started_on)}</div><div>Tratamento: ${dateTimeFmt(t.treatment_at)}</div><div>Retorno: ${dateTimeFmt(t.return_at)} ${t.teeth?.length?' · Dente(s): '+E(t.teeth.join(', ')):''}</div><div>${t.notes?'Anotações: '+E(t.notes):''}</div><div>Valor: <strong>${money(t.price_cents)}</strong> · Recebido: ${money(totalPaid(t))}</div>${t.ended_on?`<div>Finalizado em ${dateFmt(t.ended_on)} · Somente leitura</div>`:''}</div>${!t.ended_on?`<div class="treatment-actions"><button class="button tiny" data-action="editTreatment" data-id="${E(t.id)}">✎ Atualizar pedido</button>${totalPaid(t)<t.price_cents?`<button class="button tiny light" data-action="pay" data-id="${E(t.id)}">＄ Registrar pagamento</button>`:''}</div>`:`<div class="tag done">🔒 Tratamento finalizado — edição bloqueada</div>`}</div>`).join(''):'<p>Nenhum tratamento cadastrado.</p>'}`,true)}else if(m.type==='editPatient'){const p=S.data.patients.find(x=>x.id===m.id);if(!p)return;html=modalFrame('Editar paciente','O nome não pode ser modificado.',`<form id="editPatientForm"><div class="fields">${field('Nome do paciente (imutável)','name','text',p.name,'disabled')}${field('Data de nascimento','birth_date','date',p.birth_date,'required')}${field('Telefone','phone','tel',p.phone,'required')}</div><div class="form-actions"><button type="button" class="button" data-action="patient" data-id="${E(p.id)}">Voltar</button><button class="button primary" type="submit">Salvar alterações</button></div></form>`)}else if(m.type==='editTreatment'){const t=S.data.treatments.find(x=>x.id===m.id);if(!t||t.ended_on){S.modal=null;return}S.selectedTeeth=m.teethInitialized?S.selectedTeeth:[...(t.teeth||[])];m.teethInitialized=true;html=modalFrame('Atualizar pedido',E(patOf(t)?.name||'Paciente')+' · '+E(t.treatment_name),`<form id="editTreatmentForm"><div class="fields"><label class="field">Indicação<select name="referral"><option ${t.referral==='Fabio Lucena'?'selected':''}>Fabio Lucena</option><option ${t.referral==='Amanda Layse'?'selected':''}>Amanda Layse</option></select></label>${field('Início do tratamento','started_on','date',t.started_on,'required')}${field('Tratamento','treatment_name','text',t.treatment_name,'required')}<div></div>${field('Data/hora do tratamento','treatment_at','datetime-local',localDateTime(t.treatment_at),'required')}${field('Data de retorno','return_at','datetime-local',localDateTime(t.return_at))}${field('Valor total R$','price','number',(t.price_cents/100).toFixed(2),'step="0.01" min="'+(totalPaid(t)/100)+'" required')}${field('Data do término (opcional)','ended_on','date','','min="'+t.started_on+'" max="'+today()+'"')}<label class="field span2">Anotação<textarea name="notes">${E(t.notes||'')}</textarea></label><div class="span2" id="toothPicker">${toothPicker()}</div></div><div class="warning"><strong>🔒 Finalização definitiva</strong>Ao preencher uma data de término, será solicitada confirmação. Depois disso, este pedido não poderá mais ser alterado.</div><div class="form-actions"><button type="button" class="button" data-action="patient" data-id="${E(t.patient_id)}">Voltar</button><button type="submit" class="button primary">Salvar / continuar</button></div></form>`,true)}else if(m.type==='confirmEnd'){const t=S.data.treatments.find(x=>x.id===m.id);if(!t)return;html=modalFrame('Confirmar finalização','Esta ação é permanente.',`<div class="warning"><strong>Você tem certeza que deseja finalizar o tratamento?</strong><p>Após confirmar, não será possível atualizar datas, valores, notas ou registrar novos pagamentos.</p></div><div class="form-actions"><button class="button" data-action="backEnd">Voltar e revisar</button><button class="button danger" data-action="finishTreatment">🔒 Sim, finalizar tratamento</button></div>`)}else if(m.type==='pay'){const t=S.data.treatments.find(x=>x.id===m.id);if(!t||t.ended_on)return;const remain=t.price_cents-totalPaid(t);html=modalFrame('Registrar pagamento',E(t.treatment_name),`<div class="detail"><small>Saldo do tratamento</small><strong>${money(remain)}</strong></div><div style="height:15px"></div><form id="paymentForm"><div class="fields">${field('Valor recebido (R$)','amount','number',(remain/100).toFixed(2),'required step="0.01" min="0.01" max="'+(remain/100).toFixed(2)+'"')}<label class="field">Forma de pagamento<select name="method"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="transferencia">Transferência</option><option value="outro">Outro</option></select></label><label class="field span2">Anotação (opcional)<textarea name="note"></textarea></label></div><div class="form-actions"><button type="button" class="button" data-action="patient" data-id="${E(t.patient_id)}">Voltar</button><button class="button primary">Registrar recebimento</button></div></form>`)}document.body.insertAdjacentHTML('beforeend',html)}
const jsonHeaders=(token)=>({'apikey':KEY,'Authorization':'Bearer '+(token||KEY),'Content-Type':'application/json'});
function saveSession(){try{sessionStorage.setItem('oj-session',JSON.stringify({token:S.token,refreshToken:S.refreshToken,expiresAt:S.expiresAt,user:S.user,profile:S.profile}))}catch{}}
let refreshPromise=null;
async function refreshSession(){
 if(refreshPromise)return refreshPromise;
 if(!S.refreshToken)throw Error('Sua sessão expirou. Entre novamente.');
 refreshPromise=(async()=>{
  const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refreshToken})});
  let response=null;try{response=await r.json()}catch{}
  if(!r.ok||!response?.access_token||!response?.refresh_token)throw Error('Sua sessão expirou. Entre novamente.');
  S.token=response.access_token;
  S.refreshToken=response.refresh_token;
  S.expiresAt=Date.now()+Math.max(0,Number(response.expires_in)||3600)*1000;
  if(response.user)S.user=response.user;
  saveSession();
 })();
 try{await refreshPromise}finally{refreshPromise=null}
}
async function api(path,method='GET',body){
 const isAuth=path.startsWith('/auth/v1/');
 if(!isAuth&&S.token&&S.refreshToken&&S.expiresAt&&Date.now()>=S.expiresAt-60000)await refreshSession();
 const request=()=>fetch(BASE+path,{method,headers:{...jsonHeaders(S.token),'Prefer':'return=representation'},body:body===undefined?undefined:JSON.stringify(body)});
 let res=await request();
 if(!isAuth&&res.status===401&&S.token&&S.refreshToken){await refreshSession();res=await request()}
 let payload;try{payload=await res.json()}catch{payload=null}
 if(!res.ok)throw Error(payload?.message||payload?.error_description||payload?.msg||`Falha no servidor (${res.status})`);
 return payload;
}
async function fetchPaged(table,order){
 const all=[];const size=1000;
 for(let offset=0;;offset+=size){
  const page=await api('/rest/v1/'+table+'?select=*&order='+order+'.desc&limit='+size+'&offset='+offset);
  if(!Array.isArray(page))throw Error('Resposta inesperada ao carregar '+table);
  all.push(...page);
  if(page.length<size)break;
 }
 return all;
}
async function loadData(){
 const [patients,treatments,payments]=await Promise.all([fetchPaged('patients','created_at'),fetchPaged('treatments','created_at'),fetchPaged('payments','paid_at')]);
 S.data={patients,treatments,payments};render();
}
async function mutation(fun){if(S.busy)return;S.busy=true;try{await fun();if(!S.demo)await loadData();render()}catch(e){console.error(e);notify(e.message||'Erro ao salvar dados',true)}finally{S.busy=false}}
function backPatient(){const p=S.modal?.patientId||S.modal?.id;S.modal=p?{type:'patient',id:p}:null;render()}
function editTeeth(e){const act=e.target.closest('[data-action]');if(!act)return;const ac=act.dataset.action;if(ac==='tooth'){const v=act.dataset.tooth;S.selectedTeeth=S.selectedTeeth.includes(v)?S.selectedTeeth.filter(x=>x!==v):[...S.selectedTeeth,v];const picker=$('toothPicker');if(picker)picker.innerHTML=toothPicker()}else if(ac==='teethMode'){S.teethMode=act.dataset.mode;const picker=$('toothPicker');if(picker)picker.innerHTML=toothPicker()}}
function go(page){S.page=page;S.selectedTeeth=[];S.selectedPatient=null;S.teethMode='permanent';S.modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='tooth'||a==='teethMode'){editTeeth(e);return}if(b.tagName==='A')e.preventDefault();switch(a){case'demo':S.mode='app';S.demo=true;S.profile={display_name:'Equipe ODONTO JARDIM'};S.data=demoData();go('agenda');break;case'logout':if(S.token&&!S.demo)fetch(BASE+'/auth/v1/logout',{method:'POST',headers:jsonHeaders(S.token)}).catch(()=>{});S.mode='entry';S.demo=false;S.data=pref;S.token=null;S.refreshToken=null;S.expiresAt=0;S.user=null;S.modal=null;try{sessionStorage.removeItem('oj-session')}catch{}render();document.querySelector('.mobile-menu')?.remove();break;case'page':go(b.dataset.page);document.querySelector('.mobile-menu')?.remove();break;case'patient':S.modal={type:'patient',id:b.dataset.id};document.querySelector('.modal-backdrop')?.remove();renderModal();break;case'editPatient':S.modal={type:'editPatient',id:b.dataset.id};document.querySelector('.modal-backdrop')?.remove();renderModal();break;case'editTreatment':S.modal={type:'editTreatment',id:b.dataset.id,teethInitialized:false};S.teethMode='permanent';document.querySelector('.modal-backdrop')?.remove();renderModal();break;case'pay':S.modal={type:'pay',id:b.dataset.id};document.querySelector('.modal-backdrop')?.remove();renderModal();break;case'close':S.modal=null;document.querySelector('.modal-backdrop')?.remove();break;case'day':{const n=new Date(S.day+'T12:00');n.setDate(n.getDate()+Number(b.dataset.days));S.day=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;render();break}case'patientMode':{S.selectedPatient=b.dataset.mode==='new'?null:'';$('patientFields').innerHTML=patientInputs();document.querySelectorAll('[data-action="patientMode"]').forEach(el=>el.classList.toggle('active',el.dataset.mode===b.dataset.mode));break}case'filters':S.filtersOpen=!S.filtersOpen;render();break;case'clearFilters':S.filters={};render();break;case'period':S.period=b.dataset.period;render();break;case'backEnd':S.modal={type:'editTreatment',id:S.modal.id,teethInitialized:true};document.querySelector('.modal-backdrop')?.remove();renderModal();break;case'finishTreatment':finalize();break;case'export':exportCSV();break;case'mobilemenu':{document.body.insertAdjacentHTML('beforeend',`<div class="mobile-menu"><div class="mobile-menu-inner">${logo()}${TABS.map(([k,l])=>`<button class="sidebutton" data-action="page" data-page="${k}">${ICONS[k]} &nbsp; ${l}</button>`).join('')}<button class="button full" data-action="logout">Sair</button><button class="button full" style="margin-top:10px" data-action="closeMenu">Fechar</button></div></div>`);break}case'closeMenu':document.querySelector('.mobile-menu')?.remove();break;}}
async function login(e){e.preventDefault();const fd=new FormData(e.target);S.busy=true;render();try{const auth=await api('/auth/v1/token?grant_type=password','POST',{email:fd.get('email'),password:fd.get('password')});S.token=auth.access_token;S.refreshToken=auth.refresh_token;S.expiresAt=Date.now()+Math.max(0,Number(auth.expires_in)||3600)*1000;S.user=auth.user;const staff=await api('/rest/v1/staff_profiles?select=display_name,role,active&id=eq.'+encodeURIComponent(auth.user.id));if(!staff.length||!staff[0].active)throw Error('Seu usuário ainda não foi autorizado como funcionário da clínica.');S.profile=staff[0];S.mode='app';S.demo=false;saveSession();await loadData();}catch(err){S.mode='entry';S.token=null;S.refreshToken=null;S.expiresAt=0;S.user=null;try{sessionStorage.removeItem('oj-session')}catch{}notify(err.message||'Falha ao entrar',true)}finally{S.busy=false;render()}}
function formValues(form){const v=Object.fromEntries(new FormData(form));return v}
async function submit(e){const form=e.target;if(!form?.id)return;if(!['loginForm','intakeForm','editPatientForm','editTreatmentForm','paymentForm'].includes(form.id))return;e.preventDefault();if(form.id==='loginForm'){await login(e);return}const v=formValues(form);if(form.id==='intakeForm'){const price=Math.round(Number(v.price)*100),paid=v.payment_status==='Pago'?price:v.payment_status==='Parcial'?Math.round(Number(v.paid_amount)*100):0;if(!Number.isFinite(price)||price<0||!Number.isFinite(paid)||paid<0||paid>price||(v.payment_status==='Parcial'&&(paid<=0||paid>=price))){notify('Confira os valores do pagamento.',true);return}if(S.selectedPatient===null&&(!v.name?.trim()||d(v.phone).length<10||!v.birth_date)){notify('Preencha nome, nascimento e telefone.',true);return}await mutation(async()=>{let pid=v.patient_id||id();if(S.demo){if(S.selectedPatient===null)S.data.patients.push({id:pid,name:v.name.trim(),birth_date:v.birth_date,phone:d(v.phone),created_at:new Date().toISOString()});const t={id:id(),patient_id:pid,referral:v.referral,started_on:v.started_on,treatment_name:v.treatment_name.trim(),notes:v.notes||null,treatment_at:iso(v.treatment_at),teeth:[...S.selectedTeeth],price_cents:price,return_at:iso(v.return_at),ended_on:null,created_at:new Date().toISOString()};S.data.treatments.push(t);if(paid>0)S.data.payments.push({id:id(),treatment_id:t.id,amount_cents:paid,paid_at:new Date().toISOString(),method:v.method||'pix',note:null});}else{const resp=await api('/rest/v1/rpc/create_intake','POST',{p_patient_id:v.patient_id||null,p_name:v.name||'',p_birth_date:v.birth_date||null,p_phone:d(v.phone||''),p_referral:v.referral,p_started_on:v.started_on,p_treatment_name:v.treatment_name,p_notes:v.notes||'',p_treatment_at:iso(v.treatment_at),p_teeth:S.selectedTeeth,p_price_cents:price,p_return_at:iso(v.return_at),p_initial_payment_cents:paid,p_payment_method:v.method||'pix'});pid=typeof resp==='string'?resp:pid}S.page='patients';S.filters={};S.selectedTeeth=[];S.selectedPatient=null;S.modal={type:'patient',id:pid};notify('Agendamento cadastrado!')});return}
if(form.id==='editPatientForm'){const pid=S.modal.id;await mutation(async()=>{if(S.demo){const p=S.data.patients.find(x=>x.id===pid);p.birth_date=v.birth_date;p.phone=d(v.phone)}else await api('/rest/v1/patients?id=eq.'+pid,'PATCH',{birth_date:v.birth_date,phone:d(v.phone)});S.modal={type:'patient',id:pid};notify('Paciente atualizado!')});return}
if(form.id==='editTreatmentForm'){const t=S.data.treatments.find(x=>x.id===S.modal.id);const changes={referral:v.referral,started_on:v.started_on,treatment_name:v.treatment_name,notes:v.notes||null,treatment_at:iso(v.treatment_at),return_at:iso(v.return_at),price_cents:Math.round(Number(v.price)*100),teeth:[...S.selectedTeeth],ended_on:v.ended_on||null};if(changes.price_cents<totalPaid(t)){notify('O valor não pode ser menor do que os pagamentos já recebidos.',true);return}if(changes.ended_on){S.modal={type:'confirmEnd',id:t.id,changes};document.querySelector('.modal-backdrop')?.remove();renderModal();return}await applyTreatment(t,changes);return}
if(form.id==='paymentForm'){const t=S.data.treatments.find(x=>x.id===S.modal.id);const amount=Math.round(Number(v.amount)*100);if(!Number.isFinite(amount)||amount<=0||amount>t.price_cents-totalPaid(t)){notify('Valor inválido para o saldo disponível.',true);return}await mutation(async()=>{if(S.demo){S.data.payments.push({id:id(),treatment_id:t.id,amount_cents:amount,paid_at:new Date().toISOString(),method:v.method,note:v.note||null})}else await api('/rest/v1/payments','POST',{treatment_id:t.id,amount_cents:amount,method:v.method,note:v.note||null});S.modal={type:'patient',id:t.patient_id};notify('Pagamento registrado!')});return}}
async function applyTreatment(t,changes){await mutation(async()=>{if(S.demo){if(t.ended_on)throw Error('Tratamento finalizado.');Object.assign(t,changes)}else await api('/rest/v1/treatments?id=eq.'+t.id,'PATCH',changes);S.modal={type:'patient',id:t.patient_id};notify(changes.ended_on?'Tratamento finalizado e bloqueado!':'Tratamento atualizado!')})}
async function finalize(){const m=S.modal,t=S.data.treatments.find(x=>x.id===m.id);if(!t||t.ended_on)return;await applyTreatment(t,m.changes)}
function exportCSV(){const t=today(),lo=S.period==='day'?t:S.period==='month'?t.slice(0,7)+'-01':S.period==='year'?t.slice(0,4)+'-01-01':S.start,hi=S.period==='day'?t:S.period==='month'?`${t.slice(0,7)}-${new Date(Number(t.slice(0,4)),Number(t.slice(5,7)),0).getDate()}`:S.period==='year'?t.slice(0,4)+'-12-31':S.end;const payments=S.data.payments.filter(p=>{const v=localDateTime(p.paid_at).slice(0,10);return v>=lo&&v<=hi});const escapeCSV=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[['Data','Paciente','Tratamento','Metodo','Valor recebido R$'],...payments.map(p=>{const tr=S.data.treatments.find(t=>t.id===p.treatment_id);return [dateTimeFmt(p.paid_at),patOf(tr)?.name||'',tr?.treatment_name||'',p.method,(p.amount_cents/100).toFixed(2).replace('.',',')]})];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(escapeCSV).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='odonto-jardim-faturamento.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notify('CSV exportado!')}
function change(e){const t=e.target;if(t.id==='calendarDate'){S.day=t.value;render()}else if(t.id==='paymentStatus'){const ex=$('paymentExtra');if(ex)ex.classList.toggle('hidden',t.value==='Pendente')}else if(t.name?.startsWith('filter-')){S.filters[t.name.slice(7)]=t.value;const active=document.activeElement;const n=t.name,caret=t.selectionStart;render();const newEl=document.querySelector(`[name="${n}"]`);if(newEl){newEl.focus();if(caret!==null&&newEl.setSelectionRange&&newEl.type!=='date'&&newEl.tagName!=='SELECT'){try{newEl.setSelectionRange(caret,caret)}catch{}}}}else if(t.id==='financeStart'){S.start=t.value;render()}else if(t.id==='financeEnd'){S.end=t.value;render()}}
document.addEventListener('click',handleClick);document.addEventListener('submit',submit);document.addEventListener('change',change);document.addEventListener('input',e=>{if(e.target.name?.startsWith('filter-')&&e.target.type!=='date')change(e)});document.addEventListener('click',e=>{if(e.target.id==='modalBackdrop'){S.modal=null;e.target.remove()}if(e.target.classList?.contains('mobile-menu'))e.target.remove()});
try{const old=sessionStorage.getItem('oj-session');if(old){const saved=JSON.parse(old);if(saved?.token){S.token=saved.token;S.refreshToken=saved.refreshToken||null;S.expiresAt=saved.expiresAt||0;S.user=saved.user;S.profile=saved.profile;S.mode='app';loadData().catch(()=>{S.mode='entry';S.token=null;S.refreshToken=null;S.expiresAt=0;S.data=pref;sessionStorage.removeItem('oj-session');render()})}}}catch{}render();
})();
